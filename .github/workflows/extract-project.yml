name: Extract Business Doctor AI ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            echo "Upload the Business Doctor AI ZIP first."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf __project
          mkdir __project

          unzip -o "$ZIP_FILE" -d __project

          echo "ZIP extracted successfully."

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$(basename "$ZIP_FILE")" \
            -exec rm -rf {} +

          cp -a __project/. .

          rm -rf __project
          rm -f "$ZIP_FILE"

          echo "Business Doctor AI project restored."

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Restore Business Doctor AI project structure"
          git push        

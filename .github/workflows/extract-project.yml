name: Extract Business Doctor AI ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          rm -rf __project
          mkdir __project

          unzip -q business-doctor-ai-github-upload.zip -d __project

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'business-doctor-ai-github-upload.zip' \
            -exec rm -rf {} +

          cp -a __project/. .

          rm -rf __project
          rm -f business-doctor-ai-github-upload.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Extract Business Doctor AI project"
          git push
